<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイルドWebオリパ - 色演出強化版</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --gold: #fbbf24;
      --silver: #e2e8f0;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #c084fc;
      --green: #22c55e;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      padding: 1rem;
      background-color: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--accent-color);
    }

    .status-bar {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .status-item {
      background: rgba(255,255,255,0.05);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .status-value {
      font-weight: bold;
      color: var(--gold);
    }

    .reset-btn {
      margin-top: 0.5rem;
      background: #dc2626;
      color: white;
      border: none;
      padding: 0.25rem 0.75rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      cursor: pointer;
    }

    main {
      width: 100%;
      max-width: 480px;
      padding: 1.25rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .oripa-card {
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 1rem;
      padding: 1.25rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
      box-sizing: border-box;
    }

    .oripa-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .oripa-desc {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 1.25rem;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    button.gacha-btn {
      width: 100%;
      padding: 0.875rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s;
    }

    button.gacha-btn:active {
      transform: scale(0.98);
    }

    .btn-single { background-color: #3b82f6; color: white; }
    .btn-ten { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; }
    .btn-twenty { background: linear-gradient(135deg, #f59e0b, #ef4444); color: white; }

    /* --- ガチャ演出モーダル --- */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.95);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 1rem;
      overflow: hidden;
    }

    .modal.active { display: flex; }

    .effect-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .pack-icon {
      font-size: 5rem;
      animation: packBounce 0.8s infinite alternate;
    }

    @keyframes packBounce {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-15px) scale(1.05); }
    }

    .cutin-text {
      font-size: 2rem;
      font-weight: 900;
      text-align: center;
      margin-top: 1rem;
      text-shadow: 0 0 20px rgba(255,255,255,0.8);
    }

    /* --- 色別の演出グラデーション（虹 > 金 > 銀 > 赤 > 青） --- */
    /* 1. 虹 (A賞) */
    .flash-rainbow {
      animation: rainbowFlash 0.3s infinite alternate;
    }
    @keyframes rainbowFlash {
      0% { background-color: rgba(236, 72, 153, 0.9); }
      33% { background-color: rgba(251, 191, 36, 0.9); }
      66% { background-color: rgba(56, 189, 248, 0.9); }
      100% { background-color: rgba(168, 85, 247, 0.9); }
    }

    /* 2. 金 (B賞) */
    .flash-gold {
      animation: goldFlash 0.4s infinite alternate;
    }
    @keyframes goldFlash {
      0% { background-color: rgba(180, 83, 9, 0.9); }
      100% { background-color: rgba(251, 191, 36, 0.95); }
    }

    /* 3. 銀 (C賞カード) */
    .flash-silver {
      animation: silverFlash 0.5s infinite alternate;
    }
    @keyframes silverFlash {
      0% { background-color: rgba(30, 41, 59, 0.95); }
      100% { background-color: rgba(226, 232, 240, 0.6); }
    }

    /* 4. 赤 (C賞ポイント) */
    .flash-red {
      animation: redFlash 0.5s infinite alternate;
    }
    @keyframes redFlash {
      0% { background-color: rgba(15, 23, 42, 0.95); }
      100% { background-color: rgba(239, 68, 68, 0.5); }
    }

    /* 5. 青 (D賞ハズレ) */
    .flash-blue {
      background-color: rgba(15, 23, 42, 0.95);
    }

    /* 画面の揺れ */
    .shake {
      animation: shake 0.4s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-10px, 10px); }
      40% { transform: translate(10px, -10px); }
      60% { transform: translate(-10px, -10px); }
      80% { transform: translate(10px, 10px); }
    }

    /* 結果一覧 */
    .result-container {
      display: none;
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      overflow-y: auto;
      background: var(--card-bg);
      border-radius: 0.75rem;
      padding: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      box-sizing: border-box;
      z-index: 101;
    }

    .result-title {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }

    .result-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem;
      background: rgba(0,0,0,0.3);
      border-radius: 0.375rem;
      font-size: 0.85rem;
    }

    .item-A { border-left: 4px solid var(--gold); background: rgba(251, 191, 36, 0.15); }
    .item-B { border-left: 4px solid var(--purple); background: rgba(192, 132, 252, 0.15); }
    .item-C { border-left: 4px solid var(--accent-color); }
    .item-D { border-left: 4px solid #64748b; }

    .badge {
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      font-weight: bold;
      font-size: 0.7rem;
    }

    .badge-A { background: linear-gradient(135deg, #fbbf24, #ef4444); color: black; }
    .badge-B { background: var(--gold); color: black; }
    .badge-C { background: var(--silver); color: black; }
    .badge-D { background: var(--blue); color: white; }

    .convert-btn {
      background-color: var(--green);
      color: white;
      border: none;
      padding: 0.35rem 0.6rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .convert-btn.converted {
      background-color: #475569;
      cursor: not-allowed;
    }

    .close-btn {
      width: 100%;
      margin-top: 1rem;
      padding: 0.75rem;
      background: #475569;
      color: white;
      border: none;
      border-radius: 0.375rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>マイルドWebオリパ (デモ)</h1>
    <div class="status-bar">
      <div class="status-item">所持金: <span id="moneyCount" class="status-value">10,000</span> 円</div>
      <div class="status-item">残数: <span id="stockCount" class="status-value">750</span>/750</div>
      <div class="status-item">所持pt: <span id="pointCount" class="status-value">0</span> pt</div>
    </div>
    <button class="reset-btn" onclick="initOripa()">最初からリセット</button>
  </header>

  <main>
    <div class="oripa-card">
      <div class="oripa-title">【1/15アド】マイルドオリパ 1口100円</div>
      <div class="oripa-desc">A賞・B賞・C賞(カード/1,000pt)封入！</div>

      <div class="button-group">
        <button class="gacha-btn btn-single" onclick="playGacha(1)">1回引く (100円)</button>
        <button class="gacha-btn btn-ten" onclick="playGacha(10)">10連引く (1,000円)</button>
        <button class="gacha-btn btn-twenty" onclick="playGacha(20)">20連引く (2,000円)</button>
      </div>
    </div>
  </main>

  <!-- 演出モーダル -->
  <div id="gachaModal" class="modal">
    <div id="effectStage" class="effect-stage">
      <div id="packIcon" class="pack-icon">🎴</div>
      <div id="cutinText" class="cutin-text">開封中...</div>
    </div>

    <!-- 結果画面 -->
    <div id="resultContainer" class="result-container">
      <div class="result-title">🎉 獲得結果 🎉</div>
      <div id="resultList" class="result-list"></div>
      <button class="close-btn" onclick="closeModal()">閉じる</button>
    </div>
  </div>

  <script>
    let stock = [];
    let currentMoney = 10000;
    let currentPoints = 0;

    function initOripa() {
      currentMoney = 10000;
      currentPoints = 0;
      stock = [];

      for(let i=0; i<2; i++) stock.push({ id: Math.random(), rank: 'A', label: '目玉カード (12,000円相当)', convertPt: 12000 });
      for(let i=0; i<3; i++) stock.push({ id: Math.random(), rank: 'B', label: '豪華SR・パラレル (2,000円相当)', convertPt: 2000 });
      for(let i=0; i<33; i++) stock.push({ id: Math.random(), rank: 'C', label: '優良カード (500円相当)', convertPt: 500 });
      for(let i=0; i<12; i++) stock.push({ id: Math.random(), rank: 'C', label: '1,000ポイント', isPoint: true, ptValue: 1000, convertPt: 0 });
      for(let i=0; i<700; i++) stock.push({ id: Math.random(), rank: 'D', label: 'ノーマルカード', convertPt: 1 });

      stock.sort(() => Math.random() - 0.5);
      updateUI();
    }

    function updateUI() {
      document.getElementById('moneyCount').innerText = currentMoney.toLocaleString();
      document.getElementById('stockCount').innerText = stock.length;
      document.getElementById('pointCount').innerText = currentPoints.toLocaleString();
    }

    function playGacha(count) {
      const cost = count * 100;
      if (currentMoney < cost) {
        alert('所持金が足りません！');
        return;
      }
      if (stock.length < count) {
        alert('残り口数が足りません！');
        return;
      }

      currentMoney -= cost;

      const modal = document.getElementById('gachaModal');
      const stage = document.getElementById('effectStage');
      const pack = document.getElementById('packIcon');
      const cutin = document.getElementById('cutinText');
      const resultContainer = document.getElementById('resultContainer');
      const resultList = document.getElementById('resultList');

      modal.className = 'modal active';
      stage.style.display = 'flex';
      resultContainer.style.display = 'none';
      cutin.innerText = 'パック開封中...';
      cutin.style.color = '#ffffff';
      pack.innerText = '🎴';

      let results = [];
      let maxRankEffect = 'blue'; // 初期値: 青 (D賞)

      for(let i=0; i<count; i++) {
        let item = stock.pop();
        results.push(item);

        // 最高レア度の判定（虹 > 金 > 銀 > 赤 > 青）
        if (item.rank === 'A') {
          maxRankEffect = 'rainbow';
        } else if (item.rank === 'B' && maxRankEffect !== 'rainbow') {
          maxRankEffect = 'gold';
        } else if (item.rank === 'C' && !item.isPoint && !['rainbow', 'gold'].includes(maxRankEffect)) {
          maxRankEffect = 'silver';
        } else if (item.isPoint && !['rainbow', 'gold', 'silver'].includes(maxRankEffect)) {
          maxRankEffect = 'red';
        }

        if (item.isPoint) currentPoints += item.ptValue;
      }

      // STEP 1: 演出切り替え (1秒後)
      setTimeout(() => {
        if (maxRankEffect === 'rainbow') {
          modal.classList.add('flash-rainbow', 'shake');
          pack.innerText = '🌈';
          cutin.innerText = '✨【虹】超目玉獲得確定！！ ✨';
          cutin.style.color = '#ffffff';
        } else if (maxRankEffect === 'gold') {
          modal.classList.add('flash-gold', 'shake');
          pack.innerText = '🥇';
          cutin.innerText = '✨【金】豪華カード確定！ ✨';
          cutin.style.color = '#fbbf24';
        } else if (maxRankEffect === 'silver') {
          modal.classList.add('flash-silver');
          pack.innerText = '🥈';
          cutin.innerText = '【銀】優良カードHIT！';
          cutin.style.color = '#e2e8f0';
        } else if (maxRankEffect === 'red') {
          modal.classList.add('flash-red');
          pack.innerText = '🔴';
          cutin.innerText = '【赤】ポイントGET！';
          cutin.style.color = '#ef4444';
        } else {
          modal.classList.add('flash-blue');
          pack.innerText = '🔵';
          cutin.innerText = '【青】開封完了';
          cutin.style.color = '#94a3b8';
        }

        // STEP 2: 結果画面へ (さらに1.2秒後)
        setTimeout(() => {
          stage.style.display = 'none';
          resultContainer.style.display = 'block';

          resultList.innerHTML = '';
          results.forEach(res => {
            const div = document.createElement('div');
            div.className = `result-item item-${res.rank}`;
            
            let btnHtml = '';
            if (!res.isPoint) {
              btnHtml = `<button class="convert-btn" onclick="convertToPoint(this, ${res.convertPt})">+${res.convertPt}pt還元</button>`;
            } else {
              btnHtml = `<span style="font-size:0.75rem; color:#ef4444; font-weight:bold;">1,000pt加算済</span>`;
            }

            div.innerHTML = `
              <div>
                <span class="badge badge-${res.rank}">${res.rank}賞</span>
                <span style="margin-left: 0.3rem;">${res.label}</span>
              </div>
              ${btnHtml}
            `;
            resultList.appendChild(div);
          });

          updateUI();
        }, 1250);

      }, 1000);
    }

    function convertToPoint(btn, ptAmount) {
      if (btn.classList.contains('converted')) return;
      currentPoints += ptAmount;
      btn.innerText = '還元完了';
      btn.classList.add('converted');
      updateUI();
    }

    function closeModal() {
      document.getElementById('gachaModal').className = 'modal';
    }

    initOripa();
  </script>
</body>
</html>
