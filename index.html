<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイルドWebオリパ - ガチャデモ</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --gold: #fbbf24;
      --purple: #c084fc;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      padding: 1rem;
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(8px);
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--accent-color);
    }

    .status-bar {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    .status-item {
      background: rgba(255,255,255,0.05);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
    }

    .status-value {
      font-weight: bold;
      color: var(--gold);
    }

    main {
      width: 100%;
      max-width: 480px;
      padding: 1.5rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .oripa-card {
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .oripa-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .oripa-desc {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    button {
      width: 100%;
      padding: 0.875rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-single {
      background-color: #3b82f6;
      color: white;
    }

    .btn-ten {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
    }

    .btn-twenty {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
    }

    /* 演出モーダル */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.9);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 1rem;
    }

    .modal.active {
      display: flex;
    }

    .cutin-animation {
      font-size: 2rem;
      font-weight: 900;
      text-align: center;
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(0.9); opacity: 0.7; }
      to { transform: scale(1.1); opacity: 1; }
    }

    .result-container {
      display: none;
      width: 100%;
      max-width: 400px;
      max-height: 70vh;
      overflow-y: auto;
      background: var(--card-bg);
      border-radius: 0.75rem;
      padding: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .result-title {
      text-align: center;
      font-size: 1.25rem;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .result-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.75rem;
      background: rgba(0,0,0,0.2);
      border-radius: 0.375rem;
      font-size: 0.9rem;
    }

    .badge {
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      font-weight: bold;
      font-size: 0.75rem;
    }

    .badge-A { background: var(--gold); color: black; }
    .badge-B { background: var(--purple); color: white; }
    .badge-C { background: var(--accent-color); color: black; }
    .badge-D { background: #64748b; color: white; }

    .close-btn {
      margin-top: 1rem;
      background: #475569;
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <h1>マイルドオリパ Web</h1>
    <div class="status-bar">
      <div class="status-item">残数: <span id="stockCount" class="status-value">750</span>/750</div>
      <div class="status-item">所持pt: <span id="pointCount" class="status-value">0</span> pt</div>
    </div>
  </header>

  <main>
    <div class="oripa-card">
      <div class="oripa-title">【1/15アド】マイルドオリパ 1口100円</div>
      <div class="oripa-desc">A賞・B賞・C賞(カード/1,000pt)封入！</div>

      <div class="button-group">
        <button class="btn-single" onclick="playGacha(1)">1回引く (100円)</button>
        <button class="btn-ten" onclick="playGacha(10)">10連引く (1,000円)</button>
        <button class="btn-twenty" onclick="playGacha(20)">20連引く (2,000円)</button>
      </div>
    </div>
  </main>

  <!-- 演出モーダル -->
  <div id="gachaModal" class="modal">
    <div id="cutin" class="cutin-animation">パック開封中...</div>

    <div id="resultContainer" class="result-container">
      <div class="result-title">獲得結果</div>
      <div id="resultList" class="result-list"></div>
      <button class="close-btn" onclick="closeModal()">閉じる</button>
    </div>
  </div>

  <script>
    // 750口の構成（A:2, B:3, Cカード:33, Cpt:12, D:700）
    let stock = [];
    let currentPoints = 0;

    function initOripa() {
      stock = [];
      for(let i=0; i<2; i++) stock.push({ rank: 'A', label: '目玉カード (12,000円相当)' });
      for(let i=0; i<3; i++) stock.push({ rank: 'B', label: '豪華SR・パラレル (2,000円相当)' });
      for(let i=0; i<33; i++) stock.push({ rank: 'C', label: '優良カード (500円相当)' });
      for(let i=0; i<12; i++) stock.push({ rank: 'C', label: '1,000ポイント', isPoint: true, ptValue: 1000 });
      for(let i=0; i<700; i++) stock.push({ rank: 'D', label: 'ノーマルカード' });

      // シャッフル
      stock.sort(() => Math.random() - 0.5);
      updateUI();
    }

    function updateUI() {
      document.getElementById('stockCount').innerText = stock.length;
      document.getElementById('pointCount').innerText = currentPoints.toLocaleString();
    }

    function playGacha(count) {
      if (stock.length < count) {
        alert('残り口数が足りません！');
        return;
      }

      const modal = document.getElementById('gachaModal');
      const cutin = document.getElementById('cutin');
      const resultContainer = document.getElementById('resultContainer');
      const resultList = document.getElementById('resultList');

      modal.classList.add('active');
      cutin.style.display = 'block';
      resultContainer.style.display = 'none';
      cutin.innerText = 'パック開封中...';

      // 演出処理（タイマー）
      setTimeout(() => {
        let results = [];
        let hasAd = false;

        for(let i=0; i<count; i++) {
          let item = stock.pop();
          results.push(item);
          if (['A', 'B', 'C'].includes(item.rank)) hasAd = true;
          if (item.isPoint) currentPoints += item.ptValue;
        }

        // カットイン変化演出
        if (hasAd) {
          cutin.innerText = '✨ 激レア演出発生！ ✨';
          cutin.style.color = '#fbbf24';
        } else {
          cutin.innerText = '開封完了';
          cutin.style.color = '#ffffff';
        }

        setTimeout(() => {
          cutin.style.display = 'none';
          resultContainer.style.display = 'block';

          resultList.innerHTML = '';
          results.forEach(res => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `
              <span>${res.label}</span>
              <span class="badge badge-${res.rank}">${res.rank}賞</span>
            `;
            resultList.appendChild(div);
          });

          updateUI();
        }, 1000);

      }, 1200);
    }

    function closeModal() {
      document.getElementById('gachaModal').classList.remove('active');
    }

    // 初期化実行
    initOripa();
  </script>
</body>
</html>
