<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>縦スクロール型 3D演出Webオリパ</title>
  <style>
    :root {
      --bg-color: #060913;
      --card-bg: #111827;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --gold: #fbbf24;
      --silver: #e2e8f0;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #c084fc;
      --green: #22c55e;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 5rem;
    }

    header {
      width: 100%;
      padding: 1rem;
      background-color: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--accent-color);
    }

    .status-bar {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .status-item {
      background: rgba(255,255,255,0.05);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .status-value {
      font-weight: bold;
      color: var(--gold);
    }

    .reset-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 0.35rem 0.75rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    main {
      width: 100%;
      max-width: 480px;
      padding: 1rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .section-card {
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 1rem;
      padding: 1.25rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.15);
      box-sizing: border-box;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.75rem;
      color: var(--accent-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .count-select {
      display: flex;
      justify-content: space-between;
      gap: 0.35rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .count-opt {
      flex: 1;
      min-width: 60px;
      padding: 0.5rem 0.25rem;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 0.5rem;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .count-opt.selected {
      border-color: var(--gold);
      background: rgba(251, 191, 36, 0.25);
      color: var(--gold);
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
    }

    button.gacha-exec-btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 900;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    }

    /* 3D 演出エリア */
    .stage-box {
      height: 380px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
      background: radial-gradient(circle, #1e1b4b, #060913);
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .card-3d-wrapper {
      width: 200px;
      height: 290px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card-3d-wrapper.flipped {
      transform: rotateY(180deg) scale(1.05);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      border: 3px solid rgba(255,255,255,0.3);
      padding: 1rem;
      box-sizing: border-box;
    }

    .card-back {
      background: linear-gradient(135deg, #ef4444, #991b1b, #450a0a);
      color: #fef08a;
      font-weight: 900;
      font-size: 1.5rem;
      border-color: #fbbf24;
    }

    .card-front {
      transform: rotateY(180deg);
      color: white;
      font-weight: 900;
    }

    .rank-S { background: linear-gradient(135deg, #f43f5e, #fbbf24, #ef4444); border-color: #fef08a; box-shadow: 0 0 40px #f43f5e; }
    .rank-A { background: linear-gradient(135deg, #f59e0b, #ef4444); border-color: #fbbf24; box-shadow: 0 0 30px #f59e0b; }
    .rank-B { background: linear-gradient(135deg, #a855f7, #ec4899); border-color: #e9d5ff; box-shadow: 0 0 25px #a855f7; }
    .rank-C { background: linear-gradient(135deg, #0284c7, #38bdf8); border-color: #bae6fd; }
    .rank-D { background: linear-gradient(135deg, #334155, #1e293b); border-color: #64748b; }

    .push-btn {
      position: absolute;
      bottom: 8%;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, #ef4444, #7f1d1d);
      color: white;
      font-size: 1.2rem;
      font-weight: 900;
      border: 5px solid #fca5a5;
      box-shadow: 0 0 30px #ef4444;
      cursor: pointer;
      animation: pulseBtn 0.45s infinite alternate;
      z-index: 20;
    }

    @keyframes pulseBtn {
      from { transform: scale(0.95); }
      to { transform: scale(1.1); }
    }

    .cutin-text {
      font-size: 1.5rem;
      font-weight: 900;
      text-align: center;
      margin-top: 0.75rem;
      text-shadow: 0 0 15px rgba(255,255,255,0.9);
    }

    /* 一覧・リスト用 */
    .sort-btn {
      background: #0369a1;
      color: white;
      border: none;
      padding: 0.25rem 0.6rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .batch-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem;
      background: rgba(0,0,0,0.3);
      border-radius: 0.375rem;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .batch-btn {
      background: var(--green);
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 0.25rem;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.75rem;
      max-height: 350px;
      overflow-y: auto;
    }

    .card-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem;
      background: rgba(0,0,0,0.4);
      border-radius: 0.375rem;
      font-size: 0.85rem;
    }

    .item-S { border-left: 4px solid #f43f5e; background: rgba(244, 63, 94, 0.2); }
    .item-A { border-left: 4px solid var(--gold); background: rgba(251, 191, 36, 0.15); }
    .item-B { border-left: 4px solid var(--purple); background: rgba(192, 132, 252, 0.15); }
    .item-C { border-left: 4px solid var(--accent-color); }
    .item-D { border-left: 4px solid #64748b; }

    .badge {
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      font-weight: bold;
      font-size: 0.7rem;
      margin-right: 0.3rem;
    }

    .badge-S { background: linear-gradient(135deg, #f43f5e, #fbbf24); color: white; }
    .badge-A { background: linear-gradient(135deg, #fbbf24, #ef4444); color: black; }
    .badge-B { background: var(--gold); color: black; }
    .badge-C { background: var(--silver); color: black; }
    .badge-D { background: var(--blue); color: white; }

    .convert-btn {
      background-color: var(--green);
      color: white;
      border: none;
      padding: 0.35rem 0.6rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* 還元確認ダイアログ */
    .confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .confirm-overlay.active { display: flex; }

    .confirm-box {
      background: var(--card-bg);
      border: 1px solid var(--accent-color);
      padding: 1.5rem;
      border-radius: 0.75rem;
      text-align: center;
      max-width: 320px;
      width: 90%;
    }

    .confirm-pt {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--green);
      margin: 0.5rem 0;
    }

    .confirm-btn-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .confirm-yes { flex: 1; background: var(--green); color: white; border: none; padding: 0.6rem; border-radius: 0.25rem; font-weight: bold; cursor: pointer; }
    .confirm-no { flex: 1; background: #64748b; color: white; border: none; padding: 0.6rem; border-radius: 0.25rem; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>マイルドWebオリパ</h1>
    <div class="status-bar">
      <div class="status-item">所持pt: <span id="pointCount" class="status-value">100,000</span> pt</div>
      <div class="status-item">残数: <span id="stockCount" class="status-value">750</span>/750</div>
    </div>
    <button class="reset-btn" onclick="initOripa()">最初からリセット</button>
  </header>

  <main>
    <!-- ガチャ実行カード -->
    <div class="section-card">
      <div style="font-weight:bold; font-size:1.1rem; color:#fca5a5; margin-bottom:0.5rem;">【1/15当たり】マイルドオリパ 1口100 pt</div>
      <div style="font-size:0.85rem; color:#94a3b8; margin-bottom:1rem;">S(12k) / A(4k) / B(2k) / C(500pt) 封入！</div>

      <div class="count-select">
        <div class="count-opt selected" onclick="selectCount(1, this)">1連</div>
        <div class="count-opt" onclick="selectCount(10, this)">10連</div>
        <div class="count-opt" onclick="selectCount(100, this)">100連</div>
        <div class="count-opt" onclick="selectCount(1000, this)">1,000連</div>
        <div class="count-opt" id="optAll" onclick="selectCount('all', this)">残り全部</div>
      </div>

      <button id="gachaExecBtn" class="gacha-exec-btn" onclick="playGacha()">1連を引く (100 pt)</button>
    </div>

    <!-- ① 演出ステージ -->
    <div id="stageArea" class="section-card">
      <div class="section-title">🎬 開封演出</div>
      <div class="stage-box">
        <div id="card3dWrapper" class="card-3d-wrapper">
          <div class="card-face card-back">
            <div style="font-size:1.5rem;">SPECIAL</div>
            <div style="font-size:1.8rem; color:#fff;">ORIPA</div>
          </div>
          <div id="cardFrontFace" class="card-face card-front rank-D">
            <div id="cardFrontRank" style="font-size:2.5rem;">D賞</div>
            <div id="cardFrontLabel" style="font-size:0.85rem; margin-top:0.5rem; text-align:center;">ノーマルカード</div>
          </div>
        </div>
        <button id="pushBtn" class="push-btn" style="display:none;" onclick="triggerEffect()">PUSH!</button>
      </div>
      <div id="cutinText" class="cutin-text">ガチャを引いてね！</div>
    </div>

    <!-- ② 今回の獲得結果 -->
    <div class="section-card">
      <div class="section-title">
        <span>🎉 今回の獲得結果</span>
        <button class="sort-btn" onclick="toggleResSort()">並び替え: <span id="resSortLabel">引いた順</span></button>
      </div>
      
      <div class="batch-header">
        <label><input type="checkbox" id="selectAllRes" onchange="toggleSelectAllRes(this)"> 全選択</label>
        <div>選択中: <b id="resBatchSum" style="color:var(--gold);">0</b> pt</div>
        <button class="batch-btn" onclick="requestConvertSelectedRes()">一括還元</button>
      </div>

      <div id="resultList" class="card-list">
        <div style="color:#64748b; text-align:center; padding:1rem; font-size:0.85rem;">ここに引いた結果が表示されます</div>
      </div>
    </div>

    <!-- ③ 保有カード一覧 -->
    <div class="section-card">
      <div class="section-title">
        <span>📦 保有カード一覧 (<span id="invCount">0</span>)</span>
        <button class="sort-btn" onclick="toggleInvSort()">並び替え: <span id="invSortLabel">引いた順</span></button>
      </div>

      <div class="batch-header">
        <label><input type="checkbox" id="selectAllInv" onchange="toggleSelectAllInv(this)"> 全選択</label>
        <div>選択中: <b id="invBatchSum" style="color:var(--gold);">0</b> pt</div>
        <button class="batch-btn" onclick="requestConvertSelectedInv()">一括還元</button>
      </div>

      <div id="inventoryList" class="card-list">
        <div style="color:#64748b; text-align:center; padding:1rem; font-size:0.85rem;">獲得した未還元カードはありません</div>
      </div>
    </div>
  </main>

  <!-- 還元確認モーダル -->
  <div id="confirmOverlay" class="confirm-overlay">
    <div class="confirm-box">
      <div style="font-weight:bold; color:var(--gold); margin-bottom:0.5rem;">ポイント還元の確認</div>
      <div>選択したカードをポイントに還元しますか？</div>
      <div id="confirmPtDisplay" class="confirm-pt">+0 pt</div>
      <div class="confirm-btn-group">
        <button class="confirm-yes" onclick="executePendingConvert()">還元する</button>
        <button class="confirm-no" onclick="closeConfirmModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <script>
    let stock = [];
    let currentPoints = 100000;
    let selectedGachaCount = 1;
    let isSelectAllMode = false;
    
    let userInventory = [];
    let currentGachaResults = [];
    let highestRankItem = null;

    let resSortMode = 'PULL';
    let invSortMode = 'PULL';
    let pendingConvertAction = null;

    const RANK_PRIORITY = { 'S': 5, 'A': 4, 'B': 3, 'C': 2, 'D': 1 };

    function initOripa() {
      currentPoints = 100000;
      userInventory = [];
      currentGachaResults = [];
      
      const TOTAL_SLOTS = 750;
      let slots = new Array(TOTAL_SLOTS).fill(null);

      let hits = [];
      for(let i=0; i<2; i++) hits.push({ rank: 'S', label: '目玉カード (12,000 pt相当)', convertPt: 12000 });
      for(let i=0; i<3; i++) hits.push({ rank: 'A', label: '豪華カード (4,000 pt相当)', convertPt: 4000 });
      for(let i=0; i<5; i++) hits.push({ rank: 'B', label: '人気SR・パラレル (2,000 pt相当)', convertPt: 2000 });
      for(let i=0; i<40; i++) hits.push({ rank: 'C', label: '優良カード (500 pt相当)', convertPt: 500 });
      
      hits.sort(() => Math.random() - 0.5);

      let step = TOTAL_SLOTS / hits.length;
      hits.forEach((hitItem, idx) => {
        let basePos = Math.floor(idx * step);
        let jitter = Math.floor(Math.random() * 9) - 4;
        let pos = Math.max(0, Math.min(TOTAL_SLOTS - 1, basePos + jitter));
        while (slots[pos] !== null) pos = (pos + 1) % TOTAL_SLOTS;
        slots[pos] = hitItem;
      });

      for (let i = 0; i < TOTAL_SLOTS; i++) {
        if (slots[i] === null) slots[i] = { rank: 'D', label: 'ノーマルカード', convertPt: 1 };
        slots[i].id = Math.random();
      }

      stock = slots;
      const firstOpt = document.querySelector('.count-opt');
      if (firstOpt) selectCount(1, firstOpt);
      updateUI();
      renderInventory();
      renderResultList();
    }

    function selectCount(count, el) {
      document.querySelectorAll('.count-opt').forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');
      isSelectAllMode = (count === 'all');
      selectedGachaCount = isSelectAllMode ? stock.length : count;
      updateGachaBtnLabel();
    }

    function updateGachaBtnLabel() {
      const btn = document.getElementById('gachaExecBtn');
      if (stock.length === 0) {
        btn.innerText = '完売しました';
        btn.disabled = true;
        return;
      }
      btn.disabled = false;
      let actualCount = isSelectAllMode ? stock.length : selectedGachaCount;
      const cost = actualCount * 100;
      btn.innerText = `${actualCount.toLocaleString()}連を引く (${cost.toLocaleString()} pt)`;
    }

    function updateUI() {
      document.getElementById('pointCount').innerText = currentPoints.toLocaleString();
      document.getElementById('stockCount').innerText = stock.length;
      document.getElementById('invCount').innerText = userInventory.length;
      if (isSelectAllMode) selectedGachaCount = stock.length;
      updateGachaBtnLabel();
    }

    function playGacha() {
      const count = isSelectAllMode ? stock.length : selectedGachaCount;
      const cost = count * 100;

      if (count === 0 || currentPoints < cost || stock.length < count) {
        alert('ポイントまたは残口数が足りません！');
        return;
      }

      currentPoints -= cost;

      // 獲得した結果を過去の保有カードへ移動
      userInventory = userInventory.concat(currentGachaResults);
      currentGachaResults = [];
      highestRankItem = { rank: 'D' };

      for(let i=0; i<count; i++) {
        let item = stock.pop();
        currentGachaResults.push(item);
        if (RANK_PRIORITY[item.rank] > RANK_PRIORITY[highestRankItem.rank]) {
          highestRankItem = item;
        }
      }

      // 演出初期化＆演出エリアへスムーズスクロール
      document.getElementById('card3dWrapper').classList.remove('flipped');
      document.getElementById('pushBtn').style.display = 'block';
      document.getElementById('cutinText').innerText = 'PUSHボタンを押せ！！';
      document.getElementById('stageArea').scrollIntoView({ behavior: 'smooth' });

      updateUI();
      renderInventory();
    }

    function triggerEffect() {
      const pushBtn = document.getElementById('pushBtn');
      const cutin = document.getElementById('cutinText');
      const wrapper = document.getElementById('card3dWrapper');
      const frontFace = document.getElementById('cardFrontFace');
      const frontRank = document.getElementById('cardFrontRank');
      const frontLabel = document.getElementById('cardFrontLabel');

      pushBtn.style.display = 'none';

      frontFace.className = `card-face card-front rank-${highestRankItem.rank}`;
      frontRank.innerText = `${highestRankItem.rank}賞`;
      frontLabel.innerText = highestRankItem.label;

      // ★ アド確定は A賞・S賞 のみ！
      if (['S', 'A'].includes(highestRankItem.rank)) {
        cutin.innerText = '⚡ チャージ中... ⚡';
        setTimeout(() => {
          wrapper.classList.add('flipped');
          cutin.innerText = highestRankItem.rank === 'S' ? '🌈🔥【超絶爆アド確定！！】🔥🌈' : '🥇🔥【アド確定！！】🔥🥇';
          renderResultList();
        }, 1500);
      } else {
        cutin.innerText = 'カードオープン...';
        setTimeout(() => {
          wrapper.classList.add('flipped');
          if (highestRankItem.rank === 'B') cutin.innerText = '💜【B賞】人気SRカードHIT！';
          else if (highestRankItem.rank === 'C') cutin.innerText = '🥈【C賞】優良カードHIT！';
          else cutin.innerText = '🔵【D賞】開封完了';
          renderResultList();
        }, 800);
      }
    }

    // 結果ソート
    function toggleResSort() {
      resSortMode = resSortMode === 'PULL' ? 'RANK' : 'PULL';
      document.getElementById('resSortLabel').innerText = resSortMode === 'PULL' ? '引いた順' : '当たり順';
      renderResultList();
    }

    function renderResultList() {
      const list = document.getElementById('resultList');
      list.innerHTML = '';

      if (currentGachaResults.length === 0) {
        list.innerHTML = '<div style="color:#64748b; text-align:center; padding:1rem; font-size:0.85rem;">ここに引いた結果が表示されます</div>';
        updateResBatchSum();
        return;
      }

      let displayList = [...currentGachaResults];
      if (resSortMode === 'RANK') {
        displayList.sort((a, b) => RANK_PRIORITY[b.rank] - RANK_PRIORITY[a.rank]);
      }

      displayList.forEach((res) => {
        const origIdx = currentGachaResults.indexOf(res);
        const div = document.createElement('div');
        div.className = `card-item item-${res.rank}`;
        div.innerHTML = `
          <div>
            <input type="checkbox" class="res-chk" data-idx="${origIdx}" data-pt="${res.convertPt}" onchange="updateResBatchSum()">
            <span class="badge badge-${res.rank}">${res.rank}賞</span>
            <span>${res.label}</span>
          </div>
          <button class="convert-btn" onclick="requestConvertSingleRes(${origIdx})">+${res.convertPt} pt</button>
        `;
        list.appendChild(div);
      });
      updateResBatchSum();
    }

    function updateResBatchSum() {
      let sum = 0;
      document.querySelectorAll('.res-chk:checked').forEach(chk => sum += parseInt(chk.dataset.pt));
      document.getElementById('resBatchSum').innerText = sum.toLocaleString();
    }

    // 保有カードソート
    function toggleInvSort() {
      invSortMode = invSortMode === 'PULL' ? 'RANK' : 'PULL';
      document.getElementById('invSortLabel').innerText = invSortMode === 'PULL' ? '引いた順' : '当たり順';
      renderInventory();
    }

    function renderInventory() {
      const list = document.getElementById('inventoryList');
      list.innerHTML = '';

      if (userInventory.length === 0) {
        list.innerHTML = '<div style="color:#64748b; text-align:center; padding:1rem; font-size:0.85rem;">獲得した未還元カードはありません</div>';
        updateInvBatchSum();
        return;
      }

      let displayList = [...userInventory];
      if (invSortMode === 'RANK') {
        displayList.sort((a, b) => RANK_PRIORITY[b.rank] - RANK_PRIORITY[a.rank]);
      }

      displayList.forEach((res) => {
        const origIdx = userInventory.indexOf(res);
        const div = document.createElement('div');
        div.className = `card-item item-${res.rank}`;
        div.innerHTML = `
          <div>
            <input type="checkbox" class="inv-chk" data-idx="${origIdx}" data-pt="${res.convertPt}" onchange="updateInvBatchSum()">
            <span class="badge badge-${res.rank}">${res.rank}賞</span>
            <span>${res.label}</span>
          </div>
          <button class="convert-btn" onclick="requestConvertSingleInv(${origIdx})">+${res.convertPt} pt</button>
        `;
        list.appendChild(div);
      });
      updateInvBatchSum();
    }

    function updateInvBatchSum() {
      let sum = 0;
      document.querySelectorAll('.inv-chk:checked').forEach(chk => sum += parseInt(chk.dataset.pt));
      document.getElementById('invBatchSum').innerText = sum.toLocaleString();
    }

    /* 還元モーダル処理 */
    function openConfirmModal(ptValue, actionFn) {
      document.getElementById('confirmPtDisplay').innerText = `+${ptValue.toLocaleString()} pt`;
      pendingConvertAction = actionFn;
      document.getElementById('confirmOverlay').classList.add('active');
    }

    function closeConfirmModal() {
      document.getElementById('confirmOverlay').classList.remove('active');
      pendingConvertAction = null;
    }

    function executePendingConvert() {
      if (pendingConvertAction) pendingConvertAction();
      closeConfirmModal();
    }

    function requestConvertSingleRes(idx) {
      openConfirmModal(currentGachaResults[idx].convertPt, () => {
        currentPoints += currentGachaResults.splice(idx, 1)[0].convertPt;
        updateUI();
        renderResultList();
      });
    }

    function requestConvertSelectedRes() {
      const chks = document.querySelectorAll('.res-chk:checked');
      if (chks.length === 0) return alert('還元するカードを選択してください');
      let sum = 0;
      chks.forEach(chk => sum += parseInt(chk.dataset.pt));

      openConfirmModal(sum, () => {
        const indices = Array.from(chks).map(c => parseInt(c.dataset.idx)).sort((a,b) => b-a);
        indices.forEach(idx => currentPoints += currentGachaResults.splice(idx, 1)[0].convertPt);
        document.getElementById('selectAllRes').checked = false;
        updateUI();
        renderResultList();
      });
    }

    function requestConvertSingleInv(idx) {
      openConfirmModal(userInventory[idx].convertPt, () => {
        currentPoints += userInventory.splice(idx, 1)[0].convertPt;
        updateUI();
        renderInventory();
      });
    }

    function requestConvertSelectedInv() {
      const chks = document.querySelectorAll('.inv-chk:checked');
      if (chks.length === 0) return alert('還元するカードを選択してください');
      let sum = 0;
      chks.forEach(chk => sum += parseInt(chk.dataset.pt));

      openConfirmModal(sum, () => {
        const indices = Array.from(chks).map(c => parseInt(c.dataset.idx)).sort((a,b) => b-a);
        indices.forEach(idx => currentPoints += userInventory.splice(idx, 1)[0].convertPt);
        document.getElementById('selectAllInv').checked = false;
        updateUI();
        renderInventory();
      });
    }

    function toggleSelectAllRes(master) {
      document.querySelectorAll('.res-chk').forEach(chk => chk.checked = master.checked);
      updateResBatchSum();
    }

    function toggleSelectAllInv(master) {
      document.querySelectorAll('.inv-chk').forEach(chk => chk.checked = master.checked);
      updateInvBatchSum();
    }

    initOripa();
  </script>
</body>
</html>
