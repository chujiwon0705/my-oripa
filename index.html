<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイルドWebオリパ - デモ</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --gold: #fbbf24;
      --silver: #e2e8f0;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #c084fc;
      --green: #22c55e;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 3rem;
    }

    header {
      width: 100%;
      padding: 1rem;
      background-color: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--accent-color);
    }

    .status-bar {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .status-item {
      background: rgba(255,255,255,0.05);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .status-value {
      font-weight: bold;
      color: var(--gold);
    }

    .header-btns {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .reset-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 0.35rem 0.75rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .nav-inv-btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 0.35rem 0.75rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      width: 100%;
      max-width: 480px;
      padding: 1rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .oripa-card {
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 1rem;
      padding: 1.25rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
      box-sizing: border-box;
    }

    .oripa-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .oripa-desc {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 1rem;
    }

    .count-select {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .count-opt {
      flex: 1;
      padding: 0.5rem;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .count-opt.selected {
      border-color: var(--gold);
      background: rgba(251, 191, 36, 0.2);
      color: var(--gold);
    }

    button.gacha-exec-btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 900;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
      transition: transform 0.1s;
    }

    button.gacha-exec-btn:active {
      transform: scale(0.98);
    }

    /* --- モーダル共通 --- */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.95);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 1rem;
      overflow: hidden;
    }

    .modal.active { display: flex; }

    .effect-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .push-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, #ef4444, #991b1b);
      color: white;
      font-size: 1.2rem;
      font-weight: 900;
      border: 6px solid #fca5a5;
      box-shadow: 0 0 30px #ef4444;
      cursor: pointer;
      animation: pulseBtn 0.6s infinite alternate;
      display: none;
    }

    @keyframes pulseBtn {
      from { transform: scale(0.95); box-shadow: 0 0 20px #ef4444; }
      to { transform: scale(1.1); box-shadow: 0 0 40px #ef4444; }
    }

    .cutin-text {
      font-size: 2rem;
      font-weight: 900;
      text-align: center;
      margin-top: 1rem;
      text-shadow: 0 0 20px rgba(255,255,255,0.8);
    }

    /* 演出カラーフラッシュ（揺れなし） */
    .flash-rainbow { animation: rainbowFlash 0.3s infinite alternate; }
    .flash-gold { animation: goldFlash 0.4s infinite alternate; }
    .flash-silver { animation: silverFlash 0.5s infinite alternate; }
    .flash-blue { background-color: rgba(15, 23, 42, 0.95); }

    @keyframes rainbowFlash {
      0% { background-color: rgba(236, 72, 153, 0.9); }
      33% { background-color: rgba(251, 191, 36, 0.9); }
      66% { background-color: rgba(56, 189, 248, 0.9); }
      100% { background-color: rgba(168, 85, 247, 0.9); }
    }
    @keyframes goldFlash {
      0% { background-color: rgba(180, 83, 9, 0.9); }
      100% { background-color: rgba(251, 191, 36, 0.95); }
    }
    @keyframes silverFlash {
      0% { background-color: rgba(30, 41, 59, 0.95); }
      100% { background-color: rgba(226, 232, 240, 0.6); }
    }

    /* 結果画面 & 商品一覧モーダル内部 */
    .modal-content-box {
      width: 100%;
      max-width: 440px;
      max-height: 80vh;
      overflow-y: auto;
      background: var(--card-bg);
      border-radius: 0.75rem;
      padding: 1.25rem;
      border: 1px solid rgba(255,255,255,0.2);
      box-sizing: border-box;
    }

    .result-list, .inventory-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .result-item, .inventory-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem;
      background: rgba(0,0,0,0.3);
      border-radius: 0.375rem;
      font-size: 0.85rem;
    }

    .item-A { border-left: 4px solid var(--gold); background: rgba(251, 191, 36, 0.15); }
    .item-B { border-left: 4px solid var(--purple); background: rgba(192, 132, 252, 0.15); }
    .item-C { border-left: 4px solid var(--accent-color); }
    .item-D { border-left: 4px solid #64748b; }

    .badge {
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      font-weight: bold;
      font-size: 0.7rem;
      margin-right: 0.3rem;
    }

    .badge-A { background: linear-gradient(135deg, #fbbf24, #ef4444); color: black; }
    .badge-B { background: var(--gold); color: black; }
    .badge-C { background: var(--silver); color: black; }
    .badge-D { background: var(--blue); color: white; }

    .convert-btn {
      background-color: var(--green);
      color: white;
      border: none;
      padding: 0.35rem 0.6rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .close-btn {
      width: 100%;
      margin-top: 1rem;
      padding: 0.75rem;
      background: #475569;
      color: white;
      border: none;
      border-radius: 0.375rem;
      font-weight: bold;
      cursor: pointer;
    }

    .batch-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .batch-btn {
      background: var(--green);
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 0.25rem;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>マイルドWebオリパ (デモ)</h1>
    <div class="status-bar">
      <div class="status-item">所持pt: <span id="pointCount" class="status-value">100,000</span> pt</div>
      <div class="status-item">残数: <span id="stockCount" class="status-value">750</span>/750</div>
    </div>
    <div class="header-btns">
      <button class="nav-inv-btn" onclick="openInventoryModal()">📦 獲得商品一覧 (<span id="invCountBadge">0</span>)</button>
      <button class="reset-btn" onclick="initOripa()">最初からリセット</button>
    </div>
  </header>

  <main>
    <div class="oripa-card">
      <div class="oripa-title">【1/15当たり】マイルドオリパ 1口100 pt</div>
      <div class="oripa-desc">A賞(12,000pt) / B賞(2,000pt) / C賞(500pt) 封入！</div>

      <!-- 回数選択 -->
      <div class="count-select">
        <div class="count-opt selected" onclick="selectCount(1, this)">1連</div>
        <div class="count-opt" onclick="selectCount(10, this)">10連</div>
        <div class="count-opt" onclick="selectCount(100, this)">100連</div>
        <div class="count-opt" onclick="selectCount(1000, this)">1,000連</div>
      </div>

      <button id="gachaExecBtn" class="gacha-exec-btn" onclick="playGacha()">1連を引く (100 pt)</button>
    </div>
  </main>

  <!-- ガチャ演出 ＆ 結果モーダル -->
  <div id="gachaModal" class="modal">
    <div id="effectStage" class="effect-stage">
      <button id="pushBtn" class="push-btn" onclick="triggerPachinkoEffect()">PUSH!</button>
      <div id="cutinText" class="cutin-text">レバーを叩け！</div>
    </div>

    <div id="resultContainer" class="modal-content-box" style="display:none;">
      <div style="text-align:center; font-size:1.2rem; font-weight:bold; color:var(--gold);">🎉 今回の獲得結果 🎉</div>
      <div class="batch-actions">
        <label><input type="checkbox" id="selectAllRes" onchange="toggleSelectAllRes(this)"> 全選択</label>
        <button class="batch-btn" onclick="convertSelectedRes()">選択カードを一括還元</button>
      </div>
      <div id="resultList" class="result-list"></div>
      <button class="close-btn" onclick="closeGachaModal()">閉じる（商品一覧に保存）</button>
    </div>
  </div>

  <!-- 別画面：獲得商品一覧（コレクション）モーダル -->
  <div id="inventoryModal" class="modal">
    <div class="modal-content-box">
      <div style="text-align:center; font-size:1.2rem; font-weight:bold; color:var(--accent-color);">📦 獲得カード一覧</div>
      <div class="batch-actions">
        <label><input type="checkbox" id="selectAllInv" onchange="toggleSelectAllInv(this)"> 全選択</label>
        <button class="batch-btn" onclick="convertSelectedInv()">選択したカードを一括還元</button>
      </div>
      <div id="inventoryList" class="inventory-list"></div>
      <button class="close-btn" onclick="closeInventoryModal()">閉じる</button>
    </div>
  </div>

  <script>
    let stock = [];
    let currentPoints = 100000;
    let selectedGachaCount = 1;
    let userInventory = []; // 未還元カード保持
    let currentGachaResults = []; // 今回のガチャ結果

    function initOripa() {
      currentPoints = 100000;
      stock = [];
      userInventory = [];

      // A賞: 2口 (12,000 pt)
      for(let i=0; i<2; i++) stock.push({ id: Math.random(), rank: 'A', label: '目玉カード (12,000 pt相当)', convertPt: 12000 });
      // B賞: 3口 (2,000 pt)
      for(let i=0; i<3; i++) stock.push({ id: Math.random(), rank: 'B', label: '豪華SR・パラレル (2,000 pt相当)', convertPt: 2000 });
      // C賞: 45口 (500 pt)
      for(let i=0; i<45; i++) stock.push({ id: Math.random(), rank: 'C', label: '優良カード (500 pt相当)', convertPt: 500 });
      // D賞(ハズレ): 700口 (1 pt)
      for(let i=0; i<700; i++) stock.push({ id: Math.random(), rank: 'D', label: 'ノーマルカード', convertPt: 1 });

      stock.sort(() => Math.random() - 0.5);
      updateUI();
    }

    function selectCount(count, el) {
      selectedGachaCount = count;
      document.querySelectorAll('.count-opt').forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');
      const cost = count * 100;
      document.getElementById('gachaExecBtn').innerText = `${count.toLocaleString()}連を引く (${cost.toLocaleString()} pt)`;
    }

    function updateUI() {
      document.getElementById('pointCount').innerText = currentPoints.toLocaleString();
      document.getElementById('stockCount').innerText = stock.length;
      document.getElementById('invCountBadge').innerText = userInventory.length;
    }

    let pendingGachaRank = 'blue';

    function playGacha() {
      const count = selectedGachaCount;
      const cost = count * 100;

      if (currentPoints < cost) { alert('ポイントが足りません！'); return; }
      if (stock.length < count) { alert('残り口数が足りません！'); return; }

      currentPoints -= cost;

      const modal = document.getElementById('gachaModal');
      const stage = document.getElementById('effectStage');
      const pushBtn = document.getElementById('pushBtn');
      const cutin = document.getElementById('cutinText');
      const resultContainer = document.getElementById('resultContainer');

      modal.className = 'modal active';
      stage.style.display = 'flex';
      resultContainer.style.display = 'none';

      currentGachaResults = [];
      pendingGachaRank = 'blue';

      for(let i=0; i<count; i++) {
        let item = stock.pop();
        currentGachaResults.push(item);

        if (item.rank === 'A') pendingGachaRank = 'rainbow';
        else if (item.rank === 'B' && pendingGachaRank !== 'rainbow') pendingGachaRank = 'gold';
        else if (item.rank === 'C' && !['rainbow', 'gold'].includes(pendingGachaRank)) pendingGachaRank = 'silver';
      }

      pushBtn.style.display = 'block';
      cutin.innerText = 'ボタンを叩け！！';
      cutin.style.color = '#ffffff';
      updateUI();
    }

    function triggerPachinkoEffect() {
      const pushBtn = document.getElementById('pushBtn');
      const modal = document.getElementById('gachaModal');
      const cutin = document.getElementById('cutinText');

      pushBtn.style.display = 'none';

      if (pendingGachaRank === 'rainbow') {
        modal.classList.add('flash-rainbow');
        cutin.innerText = '🌈【虹】超極上アド確定！！ 🌈';
      } else if (pendingGachaRank === 'gold') {
        modal.classList.add('flash-gold');
        cutin.innerText = '🥇【金】激熱！豪華カード獲得！ 🥇';
      } else if (pendingGachaRank === 'silver') {
        modal.classList.add('flash-silver');
        cutin.innerText = '🥈【銀】優良カードHIT！';
      } else {
        modal.classList.add('flash-blue');
        cutin.innerText = '🔵【青】開封完了';
      }

      setTimeout(() => {
        document.getElementById('effectStage').style.display = 'none';
        document.getElementById('resultContainer').style.display = 'block';
        renderResultList();
      }, 1000);
    }

    function renderResultList() {
      const list = document.getElementById('resultList');
      list.innerHTML = '';

      currentGachaResults.forEach((res, idx) => {
        const div = document.createElement('div');
        div.className = `result-item item-${res.rank}`;
        div.innerHTML = `
          <div>
            <input type="checkbox" class="res-chk" data-idx="${idx}">
            <span class="badge badge-${res.rank}">${res.rank}賞</span>
            <span>${res.label}</span>
          </div>
          <button class="convert-btn" onclick="convertSingleRes(${idx})">+${res.convertPt} pt還元</button>
        `;
        list.appendChild(div);
      });
    }

    function convertSingleRes(idx) {
      const item = currentGachaResults.splice(idx, 1)[0];
      currentPoints += item.convertPt;
      updateUI();
      renderResultList();
    }

    function toggleSelectAllRes(master) {
      document.querySelectorAll('.res-chk').forEach(chk => chk.checked = master.checked);
    }

    function convertSelectedRes() {
      const chks = document.querySelectorAll('.res-chk:checked');
      const indices = Array.from(chks).map(c => parseInt(c.dataset.idx)).sort((a,b) => b-a);
      
      indices.forEach(idx => {
        const item = currentGachaResults.splice(idx, 1)[0];
        currentPoints += item.convertPt;
      });

      document.getElementById('selectAllRes').checked = false;
      updateUI();
      renderResultList();
    }

    function closeGachaModal() {
      userInventory = userInventory.concat(currentGachaResults);
      currentGachaResults = [];
      document.getElementById('gachaModal').className = 'modal';
      updateUI();
    }

    /* --- 商品一覧（コレクション）モーダル制御 --- */
    function openInventoryModal() {
      document.getElementById('inventoryModal').classList.add('active');
      renderInventory();
    }

    function closeInventoryModal() {
      document.getElementById('inventoryModal').classList.remove('active');
    }

    function renderInventory() {
      const list = document.getElementById('inventoryList');
      list.innerHTML = '';

      if (userInventory.length === 0) {
        list.innerHTML = '<div style="color:#64748b; font-size:0.85rem; padding:1.5rem; text-align:center;">未還元の獲得カードはありません</div>';
        return;
      }

      userInventory.forEach((res, idx) => {
        const div = document.createElement('div');
        div.className = `inventory-item item-${res.rank}`;
        div.innerHTML = `
          <div>
            <input type="checkbox" class="inv-chk" data-idx="${idx}">
            <span class="badge badge-${res.rank}">${res.rank}賞</span>
            <span>${res.label}</span>
          </div>
          <button class="convert-btn" onclick="convertSingleInv(${idx})">+${res.convertPt} pt還元</button>
        `;
        list.appendChild(div);
      });
    }

    function convertSingleInv(idx) {
      const item = userInventory.splice(idx, 1)[0];
      currentPoints += item.convertPt;
      updateUI();
      renderInventory();
    }

    function toggleSelectAllInv(master) {
      document.querySelectorAll('.inv-chk').forEach(chk => chk.checked = master.checked);
    }

    function convertSelectedInv() {
      const chks = document.querySelectorAll('.inv-chk:checked');
      const indices = Array.from(chks).map(c => parseInt(c.dataset.idx)).sort((a,b) => b-a);

      indices.forEach(idx => {
        const item = userInventory.splice(idx, 1)[0];
        currentPoints += item.convertPt;
      });

      document.getElementById('selectAllInv').checked = false;
      updateUI();
      renderInventory();
    }

    initOripa();
  </script>
</body>
</html>
