<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超演出Webオリパ - エクストレカ風3D＆パーティクル版</title>
  <style>
    :root {
      --bg-color: #060913;
      --card-bg: #111827;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --gold: #fbbf24;
      --silver: #e2e8f0;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #c084fc;
      --green: #22c55e;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 3rem;
    }

    header {
      width: 100%;
      padding: 1rem;
      background-color: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--accent-color);
    }

    .status-bar {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .status-item {
      background: rgba(255,255,255,0.05);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .status-value {
      font-weight: bold;
      color: var(--gold);
    }

    .header-btns {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .reset-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 0.35rem 0.75rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .nav-inv-btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 0.35rem 0.75rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      width: 100%;
      max-width: 480px;
      padding: 1rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .oripa-card {
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 1rem;
      padding: 1.25rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.15);
      box-sizing: border-box;
    }

    .oripa-title {
      font-size: 1.15rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: #fca5a5;
    }

    .oripa-desc {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 1rem;
    }

    .count-select {
      display: flex;
      justify-content: space-between;
      gap: 0.35rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .count-opt {
      flex: 1;
      min-width: 60px;
      padding: 0.5rem 0.25rem;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 0.5rem;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .count-opt.selected {
      border-color: var(--gold);
      background: rgba(251, 191, 36, 0.25);
      color: var(--gold);
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
    }

    button.gacha-exec-btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 900;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
      transition: transform 0.1s;
    }

    button.gacha-exec-btn:active {
      transform: scale(0.98);
    }

    /* --- モーダル --- */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.95);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 1rem;
      overflow: hidden;
    }

    .modal.active { display: flex; }

    .effect-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas#animCanvas {
      width: 100%;
      max-width: 400px;
      height: 380px;
      border-radius: 1rem;
    }

    .push-btn {
      position: absolute;
      bottom: 12%;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      background: radial-gradient(circle, #ef4444, #7f1d1d);
      color: white;
      font-size: 1.3rem;
      font-weight: 900;
      border: 6px solid #fca5a5;
      box-shadow: 0 0 40px #ef4444;
      cursor: pointer;
      animation: pulseBtn 0.45s infinite alternate;
      z-index: 10;
    }

    @keyframes pulseBtn {
      from { transform: scale(0.95); box-shadow: 0 0 20px #ef4444; }
      to { transform: scale(1.12); box-shadow: 0 0 50px #ef4444; }
    }

    .cutin-text {
      font-size: 1.8rem;
      font-weight: 900;
      text-align: center;
      margin-top: 0.5rem;
      text-shadow: 0 0 20px rgba(255,255,255,0.9);
      z-index: 10;
    }

    .modal-content-box {
      width: 100%;
      max-width: 440px;
      max-height: 80vh;
      overflow-y: auto;
      background: var(--card-bg);
      border-radius: 0.75rem;
      padding: 1.25rem;
      border: 1px solid rgba(255,255,255,0.2);
      box-sizing: border-box;
    }

    .result-list, .inventory-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .result-item, .inventory-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem;
      background: rgba(0,0,0,0.3);
      border-radius: 0.375rem;
      font-size: 0.85rem;
    }

    .item-S { border-left: 4px solid #f43f5e; background: rgba(244, 63, 94, 0.2); }
    .item-A { border-left: 4px solid var(--gold); background: rgba(251, 191, 36, 0.15); }
    .item-B { border-left: 4px solid var(--purple); background: rgba(192, 132, 252, 0.15); }
    .item-C { border-left: 4px solid var(--accent-color); }
    .item-D { border-left: 4px solid #64748b; }

    .badge {
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      font-weight: bold;
      font-size: 0.7rem;
      margin-right: 0.3rem;
    }

    .badge-S { background: linear-gradient(135deg, #f43f5e, #fbbf24); color: white; }
    .badge-A { background: linear-gradient(135deg, #fbbf24, #ef4444); color: black; }
    .badge-B { background: var(--gold); color: black; }
    .badge-C { background: var(--silver); color: black; }
    .badge-D { background: var(--blue); color: white; }

    .convert-btn {
      background-color: var(--green);
      color: white;
      border: none;
      padding: 0.35rem 0.6rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .close-btn {
      width: 100%;
      margin-top: 1rem;
      padding: 0.75rem;
      background: #475569;
      color: white;
      border: none;
      border-radius: 0.375rem;
      font-weight: bold;
      cursor: pointer;
    }

    .batch-header {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 0.5rem;
      padding: 0.5rem;
      background: rgba(0,0,0,0.2);
      border-radius: 0.375rem;
    }

    .batch-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .batch-sum {
      font-weight: bold;
      color: var(--gold);
      font-size: 0.9rem;
      text-align: right;
    }

    .batch-btn {
      background: var(--green);
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 0.25rem;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* 還元確認ダイアログ Modal */
    .confirm-box {
      background: var(--card-bg);
      border: 1px solid var(--accent-color);
      padding: 1.5rem;
      border-radius: 0.75rem;
      text-align: center;
      max-width: 320px;
      width: 90%;
    }

    .confirm-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.75rem;
      color: var(--gold);
    }

    .confirm-pt {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--green);
      margin: 0.5rem 0;
    }

    .confirm-btn-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .confirm-yes-btn {
      flex: 1;
      background: var(--green);
      color: white;
      border: none;
      padding: 0.6rem;
      border-radius: 0.25rem;
      font-weight: bold;
      cursor: pointer;
    }

    .confirm-no-btn {
      flex: 1;
      background: #64748b;
      color: white;
      border: none;
      padding: 0.6rem;
      border-radius: 0.25rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>マイルドWebオリパ (デモ)</h1>
    <div class="status-bar">
      <div class="status-item">所持pt: <span id="pointCount" class="status-value">100,000</span> pt</div>
      <div class="status-item">残数: <span id="stockCount" class="status-value">750</span>/750</div>
    </div>
    <div class="header-btns">
      <button class="nav-inv-btn" onclick="openInventoryModal()">📦 獲得商品一覧 (<span id="invCountBadge">0</span>)</button>
      <button class="reset-btn" onclick="initOripa()">最初からリセット</button>
    </div>
  </header>

  <main>
    <div class="oripa-card">
      <div class="oripa-title">【1/15当たり】マイルドオリパ 1口100 pt</div>
      <div class="oripa-desc">S(12k) / A(4k) / B(2k) / C(500pt) 封入！</div>

      <div class="count-select">
        <div class="count-opt selected" onclick="selectCount(1, this)">1連</div>
        <div class="count-opt" onclick="selectCount(10, this)">10連</div>
        <div class="count-opt" onclick="selectCount(100, this)">100連</div>
        <div class="count-opt" onclick="selectCount(1000, this)">1,000連</div>
        <div class="count-opt" id="optAll" onclick="selectCount('all', this)">残り全部</div>
      </div>

      <button id="gachaExecBtn" class="gacha-exec-btn" onclick="playGacha()">1連を引く (100 pt)</button>
    </div>
  </main>

  <!-- ガチャ演出 Modal -->
  <div id="gachaModal" class="modal">
    <div id="effectStage" class="effect-stage">
      <canvas id="animCanvas" width="400" height="380"></canvas>
      <button id="pushBtn" class="push-btn" onclick="triggerPachinkoEffect()">PUSH!</button>
      <div id="cutinText" class="cutin-text">タップして開封！</div>
    </div>

    <div id="resultContainer" class="modal-content-box" style="display:none;">
      <div style="text-align:center; font-size:1.2rem; font-weight:bold; color:var(--gold);">🎉 今回の獲得結果 🎉</div>
      
      <div class="batch-header">
        <div class="batch-actions">
          <label><input type="checkbox" id="selectAllRes" onchange="toggleSelectAllRes(this)"> 全選択</label>
          <button class="batch-btn" onclick="requestConvertSelectedRes()">選択カードを一括還元</button>
        </div>
        <div class="batch-sum">選択中還元額: <span id="resBatchSum">0</span> pt</div>
      </div>

      <div id="resultList" class="result-list"></div>
      <button class="close-btn" onclick="closeGachaModal()">閉じる（商品一覧に保存）</button>
    </div>
  </div>

  <!-- 獲得商品一覧 Modal -->
  <div id="inventoryModal" class="modal">
    <div class="modal-content-box">
      <div style="text-align:center; font-size:1.2rem; font-weight:bold; color:var(--accent-color);">📦 獲得カード一覧</div>
      
      <div class="batch-header">
        <div class="batch-actions">
          <label><input type="checkbox" id="selectAllInv" onchange="toggleSelectAllInv(this)"> 全選択</label>
          <button class="batch-btn" onclick="requestConvertSelectedInv()">選択したカードを一括還元</button>
        </div>
        <div class="batch-sum">選択中還元額: <span id="invBatchSum">0</span> pt</div>
      </div>

      <div id="inventoryList" class="inventory-list"></div>
      <button class="close-btn" onclick="closeInventoryModal()">閉じる</button>
    </div>
  </div>

  <!-- 還元確認 Modal -->
  <div id="confirmModal" class="modal" style="z-index: 200;">
    <div class="confirm-box">
      <div class="confirm-title">ポイント還元の確認</div>
      <div>選択したカードを以下のポイントに還元してよろしいですか？</div>
      <div id="confirmPtDisplay" class="confirm-pt">+0 pt</div>
      <div class="confirm-btn-group">
        <button class="confirm-yes-btn" onclick="executePendingConvert()">はい（還元する）</button>
        <button class="confirm-no-btn" onclick="closeConfirmModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <script>
    let stock = [];
    let currentPoints = 100000;
    let selectedGachaCount = 1;
    let isSelectAllMode = false;
    let userInventory = [];
    let currentGachaResults = [];
    let highestRank = 'D';
    let pendingConvertAction = null;
    let animTimer = null;
    let particles = [];

    function initOripa() {
      currentPoints = 100000;
      userInventory = [];
      
      const TOTAL_SLOTS = 750;
      let slots = new Array(TOTAL_SLOTS).fill(null);

      let hits = [];
      for(let i=0; i<2; i++) hits.push({ rank: 'S', label: '目玉カード (12,000 pt相当)', convertPt: 12000 });
      for(let i=0; i<3; i++) hits.push({ rank: 'A', label: '豪華カード (4,000 pt相当)', convertPt: 4000 });
      for(let i=0; i<5; i++) hits.push({ rank: 'B', label: '人気SR・パラレル (2,000 pt相当)', convertPt: 2000 });
      for(let i=0; i<40; i++) hits.push({ rank: 'C', label: '優良カード (500 pt相当)', convertPt: 500 });
      
      hits.sort(() => Math.random() - 0.5);

      let hitCount = hits.length;
      let step = TOTAL_SLOTS / hitCount;

      hits.forEach((hitItem, idx) => {
        let basePos = Math.floor(idx * step);
        let jitter = Math.floor(Math.random() * 9) - 4;
        let pos = Math.max(0, Math.min(TOTAL_SLOTS - 1, basePos + jitter));

        while (slots[pos] !== null) {
          pos = (pos + 1) % TOTAL_SLOTS;
        }
        slots[pos] = hitItem;
      });

      for (let i = 0; i < TOTAL_SLOTS; i++) {
        if (slots[i] === null) {
          slots[i] = { rank: 'D', label: 'ノーマルカード', convertPt: 1 };
        }
        slots[i].id = Math.random();
      }

      stock = slots;
      
      const firstOpt = document.querySelector('.count-opt');
      if (firstOpt) selectCount(1, firstOpt);
      else updateUI();
    }

    function selectCount(count, el) {
      document.querySelectorAll('.count-opt').forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');

      if (count === 'all') {
        isSelectAllMode = true;
        selectedGachaCount = stock.length;
      } else {
        isSelectAllMode = false;
        selectedGachaCount = count;
      }
      updateGachaBtnLabel();
    }

    function updateGachaBtnLabel() {
      const btn = document.getElementById('gachaExecBtn');
      if (stock.length === 0) {
        btn.innerText = '完売しました';
        btn.disabled = true;
        return;
      }
      btn.disabled = false;

      let actualCount = isSelectAllMode ? stock.length : selectedGachaCount;
      const cost = actualCount * 100;
      
      if (isSelectAllMode) {
        btn.innerText = `残り全部引く (${actualCount.toLocaleString()}連: ${cost.toLocaleString()} pt)`;
      } else {
        btn.innerText = `${actualCount.toLocaleString()}連を引く (${cost.toLocaleString()} pt)`;
      }
    }

    function updateUI() {
      document.getElementById('pointCount').innerText = currentPoints.toLocaleString();
      document.getElementById('stockCount').innerText = stock.length;
      document.getElementById('invCountBadge').innerText = userInventory.length;

      if (isSelectAllMode) {
        selectedGachaCount = stock.length;
      }
      updateGachaBtnLabel();
    }

    function playGacha() {
      const count = isSelectAllMode ? stock.length : selectedGachaCount;
      const cost = count * 100;

      if (count === 0) { alert('完売しています！'); return; }
      if (currentPoints < cost) { alert('ポイントが足りません！'); return; }
      if (stock.length < count) { alert('残り口数が足りません！'); return; }

      currentPoints -= cost;

      const modal = document.getElementById('gachaModal');
      const stage = document.getElementById('effectStage');
      const pushBtn = document.getElementById('pushBtn');
      const cutin = document.getElementById('cutinText');
      const resultContainer = document.getElementById('resultContainer');

      modal.className = 'modal active';
      stage.style.display = 'flex';
      resultContainer.style.display = 'none';

      currentGachaResults = [];
      highestRank = 'D';

      for(let i=0; i<count; i++) {
        let item = stock.pop();
        currentGachaResults.push(item);

        if (item.rank === 'S') highestRank = 'S';
        else if (item.rank === 'A' && highestRank !== 'S') highestRank = 'A';
        else if (item.rank === 'B' && !['S', 'A'].includes(highestRank)) highestRank = 'B';
        else if (item.rank === 'C' && !['S', 'A', 'B'].includes(highestRank)) highestRank = 'C';
      }

      pushBtn.style.display = 'block';
      cutin.innerText = 'ボタンを叩け！！';
      initParticles();
      startAnimLoop('PACK_INIT', 'EXTRECA');
      updateUI();
    }

    // パーティクル初期化
    function initParticles() {
      particles = [];
      for(let i=0; i<40; i++) {
        particles.push({
          x: Math.random() * 400,
          y: Math.random() * 380,
          r: Math.random() * 3 + 1,
          speedY: Math.random() * 1.5 + 0.5,
          color: ['#fbbf24', '#f43f5e', '#38bdf8', '#ffffff'][Math.floor(Math.random()*4)]
        });
      }
    }

    // Canvasループアニメーション（光・回転・閃光）
    let animFrameId = null;
    let animAngle = 0;

    function startAnimLoop(rank, mode = 'EXTRECA') {
      if (animFrameId) cancelAnimationFrame(animFrameId);

      const canvas = document.getElementById('animCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      function render() {
        animAngle += 0.05;
        ctx.clearRect(0, 0, w, h);

        if (mode === 'BLACKOUT') {
          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, w, h);
          return;
        }

        // 背景ビーム＆オーラ
        let bgGrd = ctx.createRadialGradient(w/2, h/2, 10, w/2, h/2, 220);
        if (rank === 'S') { bgGrd.addColorStop(0, '#f43f5e'); bgGrd.addColorStop(1, '#000000'); }
        else if (rank === 'A') { bgGrd.addColorStop(0, '#fbbf24'); bgGrd.addColorStop(1, '#000000'); }
        else if (rank === 'B') { bgGrd.addColorStop(0, '#c084fc'); bgGrd.addColorStop(1, '#000000'); }
        else if (rank === 'C') { bgGrd.addColorStop(0, '#38bdf8'); bgGrd.addColorStop(1, '#000000'); }
        else { bgGrd.addColorStop(0, '#ef4444'); bgGrd.addColorStop(1, '#0b0f19'); }

        ctx.fillStyle = bgGrd;
        ctx.fillRect(0, 0, w, h);

        // パーティクル描画
        particles.forEach(p => {
          p.y -= p.speedY;
          if (p.y < 0) p.y = h;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
          ctx.fill();
        });

        ctx.save();
        ctx.translate(w/2, h/2);

        if (rank === 'PACK_INIT') {
          // パックのゆらめき・立体感
          let scale = 1 + Math.sin(animAngle)*0.03;
          ctx.scale(scale, scale);

          let packGrd = ctx.createLinearGradient(-60, -100, 60, 100);
          packGrd.addColorStop(0, '#ef4444');
          packGrd.addColorStop(0.5, '#fbbf24');
          packGrd.addColorStop(1, '#b91c1c');

          ctx.fillStyle = packGrd;
          ctx.strokeStyle = '#fef08a';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.roundRect(-65, -105, 130, 210, 10);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = '900 18px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('SPECIAL', 0, -20);
          ctx.fillText('ORIPA', 0, 15);
        } else {
          // カードの回転＆オープン
          let cardGrd = ctx.createLinearGradient(-80, -120, 80, 120);
          if (rank === 'S') { cardGrd.addColorStop(0, '#f43f5e'); cardGrd.addColorStop(1, '#fbbf24'); }
          else if (rank === 'A') { cardGrd.addColorStop(0, '#f59e0b'); cardGrd.addColorStop(1, '#ef4444'); }
          else if (rank === 'B') { cardGrd.addColorStop(0, '#c084fc'); cardGrd.addColorStop(1, '#f43f5e'); }
          else if (rank === 'C') { cardGrd.addColorStop(0, '#38bdf8'); cardGrd.addColorStop(1, '#818cf8'); }
          else { cardGrd.addColorStop(0, '#3b82f6'); cardGrd.addColorStop(1, '#1e293b'); }

          ctx.fillStyle = cardGrd;
          ctx.strokeStyle = ['S', 'A', 'B'].includes(rank) ? '#ffffff' : '#64748b';
          ctx.lineWidth = 4;

          ctx.beginPath();
          ctx.roundRect(-80, -120, 160, 240, 12);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = '900 28px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(rank + '賞', 0, -10);

          if (mode === 'AD_CONFIRM') {
            ctx.fillStyle = '#fef08a';
            ctx.font = '900 20px sans-serif';
            ctx.fillText('🌈 爆アド確定！！ 🌈', 0, 45);
          } else if (mode === 'REVERSE') {
            // 画面ひび割れライン描画
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-70, -100); ctx.lineTo(-20, -10); ctx.lineTo(60, 90);
            ctx.stroke();

            ctx.fillStyle = '#fef08a';
            ctx.font = '900 20px sans-serif';
            ctx.fillText('⚡ 逆転ラッシュ！ ⚡', 0, 45);
          }
        }

        ctx.restore();
        animFrameId = requestAnimationFrame(render);
      }

      render();
    }

    // 黄金比【3.5秒】演出シーケンス
    function triggerPachinkoEffect() {
      const pushBtn = document.getElementById('pushBtn');
      const cutin = document.getElementById('cutinText');

      pushBtn.style.display = 'none';

      if (['S', 'A', 'B'].includes(highestRank)) {
        const isDirect = Math.random() > 0.4;

        // 【ステップ1：0.0秒〜1.0秒】予兆
        cutin.innerText = '⚡ チャージ中... ⚡';
        startAnimLoop('PACK_INIT', 'EXTRECA');

        setTimeout(() => {
          if (isDirect) {
            // 【ステップ2：1.0秒〜2.5秒】暗転フリーズ
            cutin.innerText = '・・・・・・';
            startAnimLoop('PACK_INIT', 'BLACKOUT');

            setTimeout(() => {
              // 【ステップ3：2.5秒〜3.5秒】極太アド確定カットイン
              cutin.innerText = highestRank === 'S' ? '🌈🔥【超絶爆アド確定！！】🔥🌈' : '🥇🔥【アド確定！！】🔥🥇';
              startAnimLoop(highestRank, 'AD_CONFIRM');
            }, 1500);

          } else {
            // 【ステップ2：1.0秒〜2.5秒】クラッシュ逆転
            cutin.innerText = 'カードオープン...！';
            startAnimLoop('C', 'EXTRECA');

            setTimeout(() => {
              // 【ステップ3：2.5秒〜3.5秒】ガラス割れ＆昇格
              cutin.innerText = `⚡ 画面割れ！${highestRank}賞へ逆転到達！！ ⚡`;
              startAnimLoop(highestRank, 'REVERSE');
            }, 1500);
          }
        }, 1000);

        setTimeout(() => {
          if (animFrameId) cancelAnimationFrame(animFrameId);
          document.getElementById('effectStage').style.display = 'none';
          document.getElementById('resultContainer').style.display = 'block';
          renderResultList();
        }, 3500);

      } else {
        // 通常演出
        cutin.innerText = 'カードオープン...';
        startAnimLoop('PACK_INIT', 'EXTRECA');

        setTimeout(() => {
          cutin.innerText = highestRank === 'C' ? '🥈【C賞】優良カードHIT！' : '🔵【D賞】開封完了';
          startAnimLoop(highestRank, 'EXTRECA');
        }, 800);

        setTimeout(() => {
          if (animFrameId) cancelAnimationFrame(animFrameId);
          document.getElementById('effectStage').style.display = 'none';
          document.getElementById('resultContainer').style.display = 'block';
          renderResultList();
        }, 1800);
      }
    }

    function renderResultList() {
      const list = document.getElementById('resultList');
      list.innerHTML = '';

      currentGachaResults.forEach((res, idx) => {
        const div = document.createElement('div');
        div.className = `result-item item-${res.rank}`;
        div.innerHTML = `
          <div>
            <input type="checkbox" class="res-chk" data-idx="${idx}" data-pt="${res.convertPt}" onchange="updateResBatchSum()">
            <span class="badge badge-${res.rank}">${res.rank}賞</span>
            <span>${res.label}</span>
          </div>
          <button class="convert-btn" onclick="requestConvertSingleRes(${idx})">+${res.convertPt} pt還元</button>
        `;
        list.appendChild(div);
      });
      updateResBatchSum();
    }

    function updateResBatchSum() {
      let sum = 0;
      document.querySelectorAll('.res-chk:checked').forEach(chk => {
        sum += parseInt(chk.dataset.pt);
      });
      document.getElementById('resBatchSum').innerText = sum.toLocaleString();
    }

    function openConfirmModal(ptValue, actionFn) {
      document.getElementById('confirmPtDisplay').innerText = `+${ptValue.toLocaleString()} pt`;
      pendingConvertAction = actionFn;
      document.getElementById('confirmModal').classList.add('active');
    }

    function closeConfirmModal() {
      document.getElementById('confirmModal').classList.remove('active');
      pendingConvertAction = null;
    }

    function executePendingConvert() {
      if (pendingConvertAction) {
        pendingConvertAction();
      }
      closeConfirmModal();
    }

    function requestConvertSingleRes(idx) {
      const item = currentGachaResults[idx];
      openConfirmModal(item.convertPt, () => {
        currentGachaResults.splice(idx, 1);
        currentPoints += item.convertPt;
        updateUI();
        renderResultList();
      });
    }

    function requestConvertSelectedRes() {
      const chks = document.querySelectorAll('.res-chk:checked');
      if (chks.length === 0) { alert('還元するカードを選択してください'); return; }

      let sum = 0;
      chks.forEach(chk => sum += parseInt(chk.dataset.pt));

      openConfirmModal(sum, () => {
        const indices = Array.from(chks).map(c => parseInt(c.dataset.idx)).sort((a,b) => b-a);
        indices.forEach(idx => {
          const item = currentGachaResults.splice(idx, 1)[0];
          currentPoints += item.convertPt;
        });
        document.getElementById('selectAllRes').checked = false;
        updateUI();
        renderResultList();
      });
    }

    function closeGachaModal() {
      userInventory = userInventory.concat(currentGachaResults);
      currentGachaResults = [];
      document.getElementById('gachaModal').className = 'modal';
      updateUI();
    }

    function openInventoryModal() {
      document.getElementById('inventoryModal').classList.add('active');
      renderInventory();
    }

    function closeInventoryModal() {
      document.getElementById('inventoryModal').classList.remove('active');
    }

    function renderInventory() {
      const list = document.getElementById('inventoryList');
      list.innerHTML = '';

      if (userInventory.length === 0) {
        list.innerHTML = '<div style="color:#64748b; font-size:0.85rem; padding:1.5rem; text-align:center;">未還元の獲得カードはありません</div>';
        updateInvBatchSum();
        return;
      }

      userInventory.forEach((res, idx) => {
        const div = document.createElement('div');
        div.className = `inventory-item item-${res.rank}`;
        div.innerHTML = `
          <div>
            <input type="checkbox" class="inv-chk" data-idx="${idx}" data-pt="${res.convertPt}" onchange="updateInvBatchSum()">
            <span class="badge badge-${res.rank}">${res.rank}賞</span>
            <span>${res.label}</span>
          </div>
          <button class="convert-btn" onclick="requestConvertSingleInv(${idx})">+${res.convertPt} pt還元</button>
        `;
        list.appendChild(div);
      });
      updateInvBatchSum();
    }

    function updateInvBatchSum() {
      let sum = 0;
      document.querySelectorAll('.inv-chk:checked').forEach(chk => {
        sum += parseInt(chk.dataset.pt);
      });
      document.getElementById('invBatchSum').innerText = sum.toLocaleString();
    }

    function requestConvertSingleInv(idx) {
      const item = userInventory[idx];
      openConfirmModal(item.convertPt, () => {
        userInventory.splice(idx, 1);
        currentPoints += item.convertPt;
        updateUI();
        renderInventory();
      });
    }

    function requestConvertSelectedInv() {
      const chks = document.querySelectorAll('.inv-chk:checked');
      if (chks.length === 0) { alert('還元するカードを選択してください'); return; }

      let sum = 0;
      chks.forEach(chk => sum += parseInt(chk.dataset.pt));

      openConfirmModal(sum, () => {
        const indices = Array.from(chks).map(c => parseInt(c.dataset.idx)).sort((a,b) => b-a);
        indices.forEach(idx => {
          const item = userInventory.splice(idx, 1)[0];
          currentPoints += item.convertPt;
        });
        document.getElementById('selectAllInv').checked = false;
        updateUI();
        renderInventory();
      });
    }

    function toggleSelectAllRes(master) {
      document.querySelectorAll('.res-chk').forEach(chk => chk.checked = master.checked);
      updateResBatchSum();
    }

    function toggleSelectAllInv(master) {
      document.querySelectorAll('.inv-chk').forEach(chk => chk.checked = master.checked);
      updateInvBatchSum();
    }

    initOripa();
  </script>
</body>
</html>
